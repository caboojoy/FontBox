name: 🔄 Google Fonts 자동 동기화

on:
  # 매주 월요일 오전 9시 (KST = UTC+9 → UTC 00:00)
  schedule:
    - cron: '0 0 * * 1'

  # 수동 실행도 가능 (GitHub Actions 탭에서 Run workflow 클릭)
  workflow_dispatch:

jobs:
  sync-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 폰트 동기화 실행
        run: npx tsx scripts/sync-google-fonts.ts
        env:
          GOOGLE_FONTS_API_KEY:        ${{ secrets.GOOGLE_FONTS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
